<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bíblia on-line e interlinear | Igreja Presbiteriana do Rio Comprido</title>
  <meta name="description" content="Leia a Bíblia em português e consulte versões interlineares em grego e hebraico, com navegação acessível por livro e capítulo.">
  <meta name="theme-color" content="#173b57">
  <link rel="canonical" href="https://dynamic-crisp-a60f33.netlify.app/biblia.html">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Bíblia on-line e interlinear">
  <meta property="og:description" content="Leia a Bíblia em português, grego e hebraico.">
  <meta property="og:url" content="https://dynamic-crisp-a60f33.netlify.app/biblia.html">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="header-container"></div>
  <main id="conteudo-principal" class="biblia-container" tabindex="-1">
    <header class="page-header">
      <p class="eyebrow">Leitura e estudo</p>
      <h1>Bíblia on-line</h1>
      <p>Escolha uma tradução, um livro e um capítulo. Use as setas do teclado para avançar ou voltar.</p>
    </header>

    <form class="navegacao-topo" aria-label="Opções de leitura" onsubmit="return false">
      <div class="campo"><label for="versao">Versão</label><select id="versao"><option value="almeida_ra.json">Almeida Revista e Atualizada</option><option value="trparsed.json">Grego interlinear</option><option value="wlc.json">Hebraico (WLC)</option><option value="pt_acf.json">Almeida Corrigida Fiel</option></select></div>
      <div class="campo"><label for="livro">Livro</label><select id="livro"></select></div>
      <div class="campo campo-curto"><label for="capitulo">Capítulo</label><select id="capitulo"></select></div>
    </form>

    <div id="status-leitura" class="status-leitura" role="status" aria-live="polite">Carregando texto bíblico…</div>
    <article aria-labelledby="titulo-capitulo">
      <h2 id="titulo-capitulo"></h2>
      <div id="versiculos" class="versiculos-lista"></div>
    </article>

    <nav class="navegacao-lateral" aria-label="Navegação entre capítulos">
      <button id="anterior-capitulo" type="button" aria-label="Capítulo anterior">‹ <span>Anterior</span></button>
      <span id="capitulo-indicador" aria-live="polite"></span>
      <button id="proximo-capitulo" type="button" aria-label="Próximo capítulo"><span>Próximo</span> ›</button>
    </nav>
  </main>
  <div id="footer-container"></div>
  <script src="includes/layout.js"></script>
  <script>
    (() => {
      let dados = [];
      const versao = document.getElementById('versao');
      const livro = document.getElementById('livro');
      const capitulo = document.getElementById('capitulo');
      const lista = document.getElementById('versiculos');
      const titulo = document.getElementById('titulo-capitulo');
      const indicador = document.getElementById('capitulo-indicador');
      const status = document.getElementById('status-leitura');
      const anterior = document.getElementById('anterior-capitulo');
      const proximo = document.getElementById('proximo-capitulo');

      const criarOpcao = (value, text) => { const option = document.createElement('option'); option.value = value; option.textContent = text; return option; };
      const salvar = () => { localStorage.setItem('versao', versao.value); localStorage.setItem('livro', livro.value); localStorage.setItem('capitulo', capitulo.value); };

      function renderizarToken(texto) {
        const fragmento = document.createDocumentFragment();
        const partes = texto.split(/\s+/);
        for (let i = 0; i < partes.length; i += 3) {
          const token = document.createElement('span'); token.className = 'token';
          const palavra = document.createElement('strong'); palavra.textContent = partes[i] || '';
          const strong = document.createElement('em'); strong.textContent = partes[i + 1] || '';
          const gramatica = document.createElement('small'); gramatica.textContent = partes[i + 2] || '';
          token.append(palavra, strong, gramatica); fragmento.append(token, ' ');
        }
        return fragmento;
      }

      function mostrarVersiculos() {
        const numero = Number(capitulo.value);
        const encontrados = dados.filter(v => v.book_name === livro.value && Number(v.chapter) === numero);
        titulo.textContent = `${livro.value} ${numero}`;
        indicador.textContent = `Capítulo ${numero} de ${capitulo.options.length}`;
        lista.replaceChildren();
        encontrados.forEach(v => {
          const p = document.createElement('p'); p.className = 'versiculo';
          const sup = document.createElement('sup'); sup.textContent = v.verse; p.append(sup, ' ');
          const texto = String(v.text || '').trim();
          p.append(/[GN]-?\d|\bG\d/.test(texto) ? renderizarToken(texto) : document.createTextNode(texto));
          lista.appendChild(p);
        });
        status.textContent = encontrados.length ? `${encontrados.length} versículos carregados.` : 'Nenhum versículo encontrado.';
        anterior.disabled = livro.selectedIndex === 0 && capitulo.selectedIndex === 0;
        proximo.disabled = livro.selectedIndex === livro.options.length - 1 && capitulo.selectedIndex === capitulo.options.length - 1;
        salvar();
      }

      function carregarCapitulos(manter = true) {
        const capitulos = [...new Set(dados.filter(v => v.book_name === livro.value).map(v => Number(v.chapter)))];
        capitulo.replaceChildren(...capitulos.map(n => criarOpcao(n, n)));
        const salvo = manter ? localStorage.getItem('capitulo') : null;
        if (salvo && capitulos.includes(Number(salvo))) capitulo.value = salvo;
        mostrarVersiculos();
      }

      async function carregarVersao(arquivo, manter = true) {
        status.textContent = 'Carregando texto bíblico…'; lista.replaceChildren();
        try {
          const response = await fetch(`dados/biblia/${arquivo}`);
          if (!response.ok) throw new Error('Arquivo bíblico indisponível');
          const json = await response.json();
          dados = arquivo === 'pt_acf.json' ? json.flatMap(item => item.chapters.flatMap((cap, ci) => cap.map((text, vi) => ({book_name:item.name, chapter:ci+1, verse:vi+1, text})))) : (json.verses || []);
          const livros = [...new Set(dados.map(v => v.book_name))];
          livro.replaceChildren(...livros.map(nome => criarOpcao(nome, nome)));
          const salvo = manter ? localStorage.getItem('livro') : null;
          if (salvo && livros.includes(salvo)) livro.value = salvo;
          carregarCapitulos(manter);
        } catch (error) {
          console.error(error); status.textContent = 'Não foi possível carregar esta versão. Tente novamente.'; status.classList.add('erro');
        }
      }

      versao.addEventListener('change', () => carregarVersao(versao.value, false));
      livro.addEventListener('change', () => carregarCapitulos(false));
      capitulo.addEventListener('change', mostrarVersiculos);
      proximo.addEventListener('click', () => { if (capitulo.selectedIndex < capitulo.options.length - 1) capitulo.selectedIndex++; else if (livro.selectedIndex < livro.options.length - 1) { livro.selectedIndex++; carregarCapitulos(false); return; } mostrarVersiculos(); });
      anterior.addEventListener('click', () => { if (capitulo.selectedIndex > 0) capitulo.selectedIndex--; else if (livro.selectedIndex > 0) { livro.selectedIndex--; carregarCapitulos(false); capitulo.selectedIndex = capitulo.options.length - 1; } mostrarVersiculos(); });
      document.addEventListener('keydown', event => { if (!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)) { if (event.key === 'ArrowRight') proximo.click(); if (event.key === 'ArrowLeft') anterior.click(); } });
      const versaoSalva = localStorage.getItem('versao'); if ([...versao.options].some(o => o.value === versaoSalva)) versao.value = versaoSalva;
      carregarVersao(versao.value);
    })();
  </script>
</body>
</html>
